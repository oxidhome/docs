version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      ci:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /.github/zola
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
