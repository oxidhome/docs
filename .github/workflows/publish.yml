name: Publish
on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "publishing"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read Zola image
        run: echo "ZOLA_IMAGE=$(sed -n 's/^FROM //p' .github/zola/Dockerfile)" >> "$GITHUB_ENV"

      - name: Check site
        run: docker run --rm -v "$GITHUB_WORKSPACE:/app" --workdir /app "$ZOLA_IMAGE" check

      - name: Build site
        run: docker run --rm -v "$GITHUB_WORKSPACE:/app" --workdir /app "$ZOLA_IMAGE" build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
